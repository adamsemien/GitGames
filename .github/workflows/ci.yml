# Standard CI for every Adam Semien repo.
# The job name `verify` is a contract: the main-gate ruleset requires a check
# called exactly `verify`. Rename the job and the gate stops matching.
# Add steps freely; keep the job name.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install dev tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
          go install github.com/vale-cli/vale/v3/cmd/vale@v3.25.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Syntax check every .js file
        run: |
          set -euo pipefail
          find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Simulate tests
        run: node tests/sim.test.mjs
      - name: Copy gate (Vale ratchet, Harper advisory)
        run: npm run lint:copy
      - name: Golden path and visual snapshots
        run: npm run test:e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: |
            playwright-report/
            test-results/
            build/copy-report.json
          retention-days: 14
