# Standard CI for every Adam Semien repo.
# The job name `verify` is a contract: the main-gate ruleset requires a check
# called exactly `verify`. Rename the job and the gate stops matching.
# Add steps freely; keep the job name.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check every .js file
        run: |
          set -euo pipefail
          find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Simulate tests
        run: node tests/sim.test.mjs
      - name: Content tests
        run: node tests/content.test.mjs
