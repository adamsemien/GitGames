# Standard CI for every Adam Semien repo.
# The job name `verify` is a contract: the main-gate ruleset requires a check
# called exactly `verify`. Rename the job and the gate stops matching.
# Here `verify` passes only when every other job passed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: syntax, simulate, copy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Install dev tools
        run: |
          npm ci
          go install github.com/vale-cli/vale/v3/cmd/vale@v3.25.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Syntax check every .js file
        run: |
          set -euo pipefail
          find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Simulate tests
        run: node tests/sim.test.mjs
      - name: Copy gate (Vale ratchet, Harper advisory)
        run: npm run lint:copy
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copy-report
          path: build/copy-report.json
          retention-days: 14

  e2e:
    name: golden path and visual snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pinned browser image: screenshots depend on fonts, so baselines are made
    # in this exact image. Bump it together with @playwright/test and re-baseline.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Playwright
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  verify:
    name: verify
    needs: [checks, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: |
          [ "${{ needs.checks.result }}" = success ] && [ "${{ needs.e2e.result }}" = success ]
